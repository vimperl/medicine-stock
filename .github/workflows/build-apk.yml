name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The release build is signed with the debug signing config, so restoring
      # the same debug keystore lets new APKs install as updates over the
      # existing app (keeping its data) instead of requiring an uninstall.
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_DEBUG_KEYSTORE_BASE64 is missing"
            exit 1
          fi
          KS="$RUNNER_TEMP/debug.keystore"
          echo "$KEYSTORE_B64" | base64 --decode > "$KS"
          echo "DEBUG_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - run: flutter pub get

      - run: flutter build apk --release --split-per-abi

      - name: Verify signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          EXPECTED=7d88788a4e33b3221ae35c4510803934f1129c4573c9b8942693281e3556add0
          echo "Signing cert SHA-256: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK is not signed with the expected key; it would not install as an update"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: medicine-stock-arm64-v8a-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
